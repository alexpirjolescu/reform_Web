<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>re_form platform — mesaje (A, dark studio)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Lexend:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#221f20}
a{color:#ffffff;text-decoration:none}a:hover{color:#77bfb2}
button,input,select,textarea{font-family:'Lexend',sans-serif}
</style>
</helmet>
<div style="height: 100vh; min-height: 760px; display: flex; background: #221f20; color: #ffffff; font-family: 'Lexend', sans-serif; overflow: hidden">

<aside style="width: 220px; flex-shrink: 0; border-right: 1px solid #403c3e; padding: 28px 16px 22px; display: flex; flex-direction: column; gap: 30px; box-sizing: border-box">
<img src="../logos/logo-platform-white.png" alt="re_form platform" style="height: 38px; width: auto; align-self: flex-start; margin-left: 6px">
<div style="padding: 0 6px"><div style="font-size: 12px; color: #bdb9bb; margin-bottom: 4px">liceul tău</div><div style="font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 16px">[Liceul tău]</div><div style="font-size: 13px; color: #bdb9bb">echipa core</div></div>
<nav aria-label="Aplicație" style="display: flex; flex-direction: column; gap: 2px; font-size: 15px">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="10"/><rect x="17" y="4" width="4" height="13"/></svg>proiecte</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg>resurse</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18"/><path d="M8 9l2 2 4-4M8 16h8"/></svg>evaluări<span style="margin-left: auto; font-size: 12px; background: #ffffff; color: #221f20; padding: 1px 7px">2</span></a>
<a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; padding: 12px 10px; background: #2f2b2d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#77bfb2" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>mesaje<span style="margin-left: auto; font-size: 12px; background: #77bfb2; color: #221f20; padding: 1px 7px">3</span></a>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 18px; padding: 0 6px">
<a href="#" style="font-size: 14px; color: #bdb9bb">panou de știri ↗</a>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #77bfb2; color: #221f20; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px">AP</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px">Ana Popescu</span><span style="font-size: 12px; color: #bdb9bb">elevă · core</span></span></div>
</div>
</aside>

<section aria-label="Conversații" style="width: 320px; flex-shrink: 0; border-right: 1px solid #403c3e; display: flex; flex-direction: column; box-sizing: border-box">
<div style="padding: 26px 18px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 36px; color: #77bfb2">mesaje</h1>
<button type="button" aria-label="Conversație nouă" style="width: 44px; height: 44px; background: #77bfb2; color: #221f20; border: 0; font-size: 22px; cursor: pointer">+</button>
</div>
<label style="display: flex; align-items: center; gap: 8px; background: #2c292a; padding: 0 12px; height: 44px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bdb9bb" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">caută persoane</span><input type="search" placeholder="caută după nume sau liceu" style="background: transparent; border: 0; color: #ffffff; font-size: 14px; width: 100%"></label>
</div>
<div style="flex-grow: 1; overflow: auto">
<sc-for list="{{convos}}" as="c" hint-placeholder-count="5">
<a href="#" style="display: flex; gap: 12px; padding: 14px 18px; background: {{c.bg}}; border-bottom: 1px solid #343032">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: {{c.c}}; color: {{c.ink}}; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px">{{c.i}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 500">{{c.name}}</span><span style="font-size: 12px; color: #bdb9bb">{{c.time}}</span></span>
<span style="font-size: 12px; color: #bdb9bb">{{c.sub}}</span>
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="font-size: 13px; color: #d9d5d7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span><sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; font-size: 12px; background: #77bfb2; color: #221f20; padding: 1px 7px">{{c.unread}}</span></sc-if></span>
</span>
</a>
</sc-for>
</div>
</section>

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; position: relative">
<div style="display: flex; align-items: center; gap: 14px; padding: 18px 28px; border-bottom: 1px solid #403c3e">
<span style="width: 44px; height: 44px; border-radius: 50%; background: #e28ba3; color: #221f20; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px">IR</span>
<div style="flex-grow: 1"><h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 19px">Ioana Radu</h2><div style="font-size: 13px; color: #bdb9bb">[Liceul tău] · echipa core</div></div>
<button type="button" aria-label="Fișiere din conversație" style="width: 44px; height: 44px; background: transparent; border: 1px solid #5a5557; color: #ffffff; display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4"/></svg></button>
<button type="button" aria-label="Mai multe opțiuni" aria-expanded="true" style="width: 44px; height: 44px; background: #2f2b2d; border: 1px solid #77bfb2; color: #ffffff; font-size: 20px; cursor: pointer">⋯</button>
<div role="menu" aria-label="Opțiuni conversație" style="position: absolute; right: 28px; top: 76px; width: 230px; background: #2c292a; border: 1px solid #5a5557; display: flex; flex-direction: column; padding: 6px 0; z-index: 2">
<button type="button" role="menuitem" style="text-align: left; padding: 12px 16px; background: transparent; border: 0; color: #ffffff; font-size: 14px; cursor: pointer">vezi profilul</button>
<button type="button" role="menuitem" style="text-align: left; padding: 12px 16px; background: transparent; border: 0; color: #ffffff; font-size: 14px; cursor: pointer">dezactivează notificările</button>
<button type="button" role="menuitem" style="text-align: left; padding: 12px 16px; background: transparent; border: 0; border-top: 1px solid #403c3e; color: #ffffff; font-size: 14px; cursor: pointer">blochează persoana</button>
<button type="button" role="menuitem" style="text-align: left; padding: 12px 16px; background: transparent; border: 0; color: #e1b345; font-size: 14px; cursor: pointer">raportează conversația</button>
</div>
</div>

<div style="flex-grow: 1; overflow: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px">
<div style="align-self: center; font-size: 12px; color: #bdb9bb; padding: 4px 0 10px">azi</div>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="6">
<div style="align-self: {{m.side}}; max-width: 62%; display: flex; flex-direction: column; gap: 4px; align-items: {{m.side}}">
<sc-if value="{{m.isFile}}" hint-placeholder-val="{{ false }}">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #2f2b2d; border: 1px solid #5a5557"><span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 11px; background: #dd6937; color: #221f20; padding: 5px 6px">PDF</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px">{{m.text}}</span><span style="font-size: 12px; color: #bdb9bb">1,2 MB · deschide</span></span></a>
</sc-if>
<sc-if value="{{m.isText}}" hint-placeholder-val="{{ true }}">
<div style="padding: 12px 16px; background: {{m.bg}}; color: {{m.ink}}; font-size: 15px; line-height: 1.5">{{m.text}}</div>
</sc-if>
<span style="font-size: 11px; color: #bdb9bb">{{m.time}}</span>
</div>
</sc-for>
</div>

<form style="display: flex; align-items: flex-end; gap: 10px; padding: 16px 28px 22px; border-top: 1px solid #403c3e">
<button type="button" aria-label="Atașează un fișier" style="width: 48px; height: 48px; flex-shrink: 0; background: transparent; border: 1px solid #5a5557; color: #ffffff; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11l-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></button>
<label style="flex-grow: 1; display: flex; flex-direction: column"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mesaj către Ioana</span><textarea rows="1" placeholder="scrie un mesaj…" style="resize: none; min-height: 48px; box-sizing: border-box; padding: 13px 14px; background: #2c292a; color: #ffffff; border: 1px solid #5a5557; font-size: 15px"></textarea></label>
<button type="button" style="height: 48px; padding: 0 20px; flex-shrink: 0; background: #77bfb2; color: #221f20; border: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer">trimite</button>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const c = (i, col, ink, name, sub, last, time, unread, sel) => ({ i, c: col, ink, name, sub, last, time, unread, hasUnread: !!unread, bg: sel ? '#2f2b2d' : 'transparent' });
const m = (mine, text, time, file) => ({ text, time, isFile: !!file, isText: !file, side: mine ? 'flex-end' : 'flex-start', bg: mine ? '#77bfb2' : '#2f2b2d', ink: mine ? '#221f20' : '#ffffff' });
return {
convos: [
c('IR', '#e28ba3', '#221f20', 'Ioana Radu', '[Liceul tău] · core', 'Ne vedem joi la atelier?', '14:02', '2', true),
c('AN', '#79569a', '#ffffff', 'Andrei', 'mentor re_form', 'Super, ne vedem joi la 16:00!', '13:40', ''),
c('MT', '#e1b345', '#221f20', 'Matei Toma', '[Liceul tău] · core', 'Cine aduce prelungitorul?', 'ieri', '1'),
c('DS', '#abca54', '#221f20', 'Daria Stan', '[Liceul tău] · core', 'Formularul e gata de testat', 'luni', ''),
c('EL', '#77bfb2', '#221f20', 'Elena', '[Liceul 2] · core', 'Mersi pentru șablon!', '7 oct', '')
],
msgs: [
m(false, 'Am terminat a doua variantă de afiș. Ți-o trimit acum.', '13:52'),
m(false, 'afis-campanie-v2.pdf', '13:52', true),
m(true, 'Arată foarte bine! Aș mări puțin titlul.', '13:55'),
m(true, 'O mut la „în revizuire”, ca s-o vadă și Matei.', '13:56'),
m(false, 'Perfect. Am pus și sursele în resurse, în folderul campaniei.', '14:02'),
m(false, 'Ne vedem joi la atelier?', '14:02')
]
};
}
}
</script>
</body>
</html>
