<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>re_form platform — proiecte (C, colour system)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Lexend:wght@300;400;500&amp;family=Sour+Gummy:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#221f20;text-decoration:none}a:hover{color:#221f20;text-decoration:underline}
button,input,select{font-family:'Lexend',sans-serif}
</style>
</helmet>
<div style="height: 100vh; min-height: 760px; display: flex; background: #ffffff; color: #221f20; font-family: 'Lexend', sans-serif; overflow: hidden">

<aside style="width: 236px; flex-shrink: 0; border-right: 2px solid #221f20; padding: 26px 18px 22px; display: flex; flex-direction: column; gap: 26px; box-sizing: border-box">
<img src="../logos/logo-platform.png" alt="re_form platform" style="height: 38px; width: auto; align-self: flex-start">
<span style="align-self: flex-start; font-size: 13px; font-weight: 500; border: 2px solid #221f20; border-radius: 999px; padding: 5px 12px">[Liceul tău] · core</span>
<nav aria-label="Aplicație" style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500">
<a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid #221f20; border-radius: 999px; background: #ffffff"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #e28ba3; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5"><rect x="3" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="10"/><rect x="17" y="4" width="4" height="13"/></svg></span>proiecte</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid transparent; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #e1b345; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5"><path d="M3 6h7l2 2h9v11H3z"/></svg></span>resurse</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid transparent; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #79569a; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><rect x="4" y="3" width="16" height="18"/><path d="M8 9l2 2 4-4M8 16h8"/></svg></span>evaluări<span style="margin-left: auto; font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 14px; background: #221f20; color: #ffffff; border-radius: 999px; padding: 1px 9px">2</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid transparent; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #dd6937; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5"><path d="M4 5h16v11H9l-5 4z"/></svg></span>mesaje<span style="margin-left: auto; font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 14px; background: #221f20; color: #ffffff; border-radius: 999px; padding: 1px 9px">3</span></a>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
<a href="#" style="font-size: 14px; font-weight: 500">← panou de știri</a>
<div style="display: flex; align-items: center; gap: 10px; border: 2px solid #221f20; border-radius: 18px; padding: 10px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #77bfb2; border: 2px solid #221f20; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; box-sizing: border-box">AP</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">Ana Popescu</span><span style="font-size: 12px; color: #5f5b5d">elevă · core</span></span></div>
</div>
</aside>

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 24px 28px 18px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 10px">
<img src="../logos/logo-core.png" alt="re_form core" style="height: 30px; width: auto; align-self: flex-start">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -0.02em">Campania „Vocea elevilor”</h1>
</div>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="border: 2px solid #221f20; border-radius: 18px; padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 190px">
<span style="font-size: 13px; font-weight: 500">3 din 12 sarcini gata</span>
<span aria-hidden="true" style="display: block; height: 10px; border: 2px solid #221f20; border-radius: 999px; overflow: hidden"><span style="display: block; width: 25%; height: 100%; background: #e28ba3"></span></span>
</div>
<div style="background: #e1b345; border: 2px solid #221f20; border-radius: 18px; padding: 8px 16px; display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 34px; line-height: 1">46</span>
<span style="font-size: 13px; font-weight: 500; line-height: 1.25">zile până la<br>demo day</span>
</div>
</div>
</div>

<div style="padding: 0 28px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div role="tablist" aria-label="Vizualizare" style="display: flex; gap: 6px">
<button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 2px solid #221f20; background: #221f20; color: #ffffff; font-size: 14px; font-weight: 500; cursor: pointer">tablă</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 2px solid #221f20; background: #ffffff; color: #221f20; font-size: 14px; cursor: pointer">calendar</button>
<button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 2px solid #221f20; background: #ffffff; color: #221f20; font-size: 14px; cursor: pointer">listă</button>
</div>
<button type="button" style="height: 44px; padding: 0 22px; border-radius: 999px; border: 2px solid #221f20; background: #e28ba3; color: #221f20; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">+ sarcină nouă</button>
</div>

<div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 0 28px 24px; display: flex; gap: 14px; align-items: flex-start">
<sc-for list="{{cols}}" as="col" hint-placeholder-count="4">
<section style="flex: 1 0 226px; background: #f5f3f1; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 8px; padding: 4px 4px 2px">
<h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 17px">{{col.name}}</h2>
<span style="font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 14px; background: #ffffff; border: 2px solid #221f20; border-radius: 999px; padding: 0 9px">{{col.count}}</span>
</div>
<sc-for list="{{col.cards}}" as="card" hint-placeholder-count="3">
<article style="background: #ffffff; border: 2px solid #221f20; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; opacity: {{card.op}}">
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{card.labels}}" as="l" hint-placeholder-count="1"><span style="font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1.5px solid #221f20; background: {{l.c}}; color: {{l.ink}}">{{l.t}}</span></sc-for></div>
<h3 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.3">{{card.title}}</h3>
<sc-if value="{{card.hasCheck}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="flex-grow: 1; height: 8px; border: 1.5px solid #221f20; border-radius: 999px; overflow: hidden"><span style="display: block; height: 100%; width: {{card.pct}}; background: #e28ba3"></span></span><span style="font-size: 12px; font-weight: 500">{{card.check}}</span></div>
</sc-if>
<div style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 12px; font-weight: 500; border: 1.5px solid #221f20; border-radius: 999px; padding: 2px 9px; background: {{card.dueBg}}">{{card.dueText}}</span>
<span style="margin-left: auto; display: flex"><sc-for list="{{card.who}}" as="w" hint-placeholder-count="1"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{w.c}}; border: 2px solid #221f20; margin-left: -6px; display: grid; place-items: center; font-size: 10px; font-weight: 600; box-sizing: border-box">{{w.i}}</span></sc-for></span>
</div>
</article>
</sc-for>
<button type="button" style="background: transparent; border: 2px dashed #221f20; border-radius: 16px; color: #221f20; padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer">+ adaugă o sarcină</button>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const AP = { i: 'AP', c: '#77bfb2' }, IR = { i: 'IR', c: '#e28ba3' }, MT = { i: 'MT', c: '#e1b345' }, DS = { i: 'DS', c: '#abca54' };
const L = (t, c, ink) => ({ t, c, ink: ink || '#221f20' });
const card = (title, labels, due, check, who, extra) => {
const parts = check ? check.split('/') : [0, 1];
return Object.assign({ title, labels, check, hasCheck: !!check, pct: Math.round(100 * parts[0] / parts[1]) + '%', dueText: due, dueBg: '#ffffff', who, op: 1 }, extra || {});
};
return {
cols: [
{ name: 'de făcut', count: '4', cards: [
card('Cere acordul direcțiunii pentru sala de festivități', [L('logistică', '#79569a', '#ffffff')], '12 oct', '0/2', [AP], { dueText: 'întârziat · 12 oct', dueBg: '#dd6937' }),
card('Sondaj în clase: ce ar schimba elevii?', [L('cercetare', '#e1b345')], '16 oct', '0/4', [MT, IR]),
card('Listă de invitați pentru dezbatere', [L('eveniment', '#dd6937')], '20 oct', '', [IR]),
card('Buget estimativ: afișe și gustări', [L('buget', '#abca54')], '21 oct', '1/3', [DS])
] },
{ name: 'în lucru', count: '3', cards: [
card('Textul pentru afiș și postările de lansare', [L('comunicare', '#77bfb2')], '15 oct', '3/5', [AP, IR]),
card('Prezentare pentru consiliul elevilor', [L('comunicare', '#77bfb2')], '17 oct', '2/6', [MT]),
card('Formular de înscriere pentru voluntari', [L('eveniment', '#dd6937')], '18 oct', '1/2', [DS])
] },
{ name: 'în revizuire', count: '2', cards: [
card('Afișul campaniei, varianta 2', [L('design', '#e28ba3')], 'azi', '2/4', [IR], { dueBg: '#e1b345' }),
card('Plan de comunicare pe 4 săptămâni', [L('comunicare', '#77bfb2')], '15 oct', '4/4', [AP])
] },
{ name: 'gata', count: '3', cards: [
card('Am ales tema campaniei', [L('cercetare', '#e1b345')], 'gata', '', [AP, IR, MT, DS], { dueBg: '#abca54' }),
card('Roluri stabilite în echipă', [L('logistică', '#79569a', '#ffffff')], 'gata', '', [MT], { dueBg: '#abca54' }),
card('Prima întâlnire cu mentorul', [L('mentorship', '#e28ba3')], 'gata', '', [AP], { dueBg: '#abca54' })
] }
]
};
}
}
</script>
</body>
</html>
