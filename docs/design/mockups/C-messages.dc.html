<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>re_form platform — mesaje (C, colour system)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Lexend:wght@300;400;500&amp;family=Sour+Gummy:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#221f20;text-decoration:none}a:hover{color:#221f20;text-decoration:underline}
button,input,select,textarea{font-family:'Lexend',sans-serif}
</style>
</helmet>
<div style="height: 100vh; min-height: 760px; display: flex; background: #ffffff; color: #221f20; font-family: 'Lexend', sans-serif; overflow: hidden">

<aside style="width: 236px; flex-shrink: 0; border-right: 2px solid #221f20; padding: 26px 18px 22px; display: flex; flex-direction: column; gap: 26px; box-sizing: border-box">
<img src="../logos/logo-platform.png" alt="re_form platform" style="height: 38px; width: auto; align-self: flex-start">
<span style="align-self: flex-start; font-size: 13px; font-weight: 500; border: 2px solid #221f20; border-radius: 999px; padding: 5px 12px">[Liceul tău] · core</span>
<nav aria-label="Aplicație" style="display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid transparent; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #e28ba3; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5"><rect x="3" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="10"/><rect x="17" y="4" width="4" height="13"/></svg></span>proiecte</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid transparent; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #e1b345; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5"><path d="M3 6h7l2 2h9v11H3z"/></svg></span>resurse</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid transparent; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #79569a; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"><rect x="4" y="3" width="16" height="18"/><path d="M8 9l2 2 4-4M8 16h8"/></svg></span>evaluări<span style="margin-left: auto; font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 14px; background: #221f20; color: #ffffff; border-radius: 999px; padding: 1px 9px">2</span></a>
<a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; padding: 6px 12px 6px 6px; border: 2px solid #221f20; border-radius: 999px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #dd6937; border: 2px solid #221f20; display: grid; place-items: center; box-sizing: border-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5"><path d="M4 5h16v11H9l-5 4z"/></svg></span>mesaje<span style="margin-left: auto; font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 14px; background: #dd6937; border: 1.5px solid #221f20; border-radius: 999px; padding: 0 8px">3</span></a>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
<a href="#" style="font-size: 14px; font-weight: 500">← panou de știri</a>
<div style="display: flex; align-items: center; gap: 10px; border: 2px solid #221f20; border-radius: 18px; padding: 10px"><span style="width: 36px; height: 36px; border-radius: 50%; background: #77bfb2; border: 2px solid #221f20; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; box-sizing: border-box">AP</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">Ana Popescu</span><span style="font-size: 12px; color: #5f5b5d">elevă · core</span></span></div>
</div>
</aside>

<section aria-label="Conversații" style="width: 320px; flex-shrink: 0; padding: 24px 16px 16px 20px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<img src="../logos/logo-community.png" alt="re_form community" style="height: 30px; width: auto; align-self: flex-start">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 32px">mesaje</h1>
<button type="button" aria-label="Conversație nouă" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #221f20; background: #dd6937; font-size: 22px; font-weight: 600; cursor: pointer">+</button>
</div>
<label style="display: flex; align-items: center; gap: 8px; border: 2px solid #221f20; border-radius: 999px; padding: 0 14px; height: 44px; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">caută persoane</span><input type="search" placeholder="pe cine cauți?" style="border: 0; font-size: 14px; width: 100%"></label>
<div style="flex-grow: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{convos}}" as="c" hint-placeholder-count="5">
<a href="#" style="display: flex; gap: 12px; padding: 10px 12px 10px 10px; border: 2px solid {{c.border}}; border-radius: 20px; background: {{c.bg}}">
<span style="flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #221f20; background: {{c.c}}; color: {{c.ink}}; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; box-sizing: border-box">{{c.i}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{c.name}}</span><span style="font-size: 12px; color: #5f5b5d">{{c.time}}</span></span>
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="font-size: 13px; color: #4a4648; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span><sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; font-family: 'Sour Gummy', sans-serif; font-weight: 700; font-size: 13px; background: #dd6937; border: 1.5px solid #221f20; border-radius: 999px; padding: 0 8px">{{c.unread}}</span></sc-if></span>
</span>
</a>
</sc-for>
</div>
</section>

<main style="flex-grow: 1; min-width: 0; margin: 16px 16px 16px 0; border: 2px solid #221f20; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 2px solid #221f20; background: #dd6937">
<span style="width: 46px; height: 46px; border-radius: 50%; background: #e28ba3; border: 2px solid #221f20; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px; box-sizing: border-box">IR</span>
<div style="flex-grow: 1"><h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px">Ioana Radu</h2><div style="font-size: 13px">[Liceul tău] · echipa core</div></div>
<button type="button" aria-label="Mai multe opțiuni: profil, blochează, raportează" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #221f20; background: #ffffff; font-size: 20px; cursor: pointer">⋯</button>
</div>

<div style="flex-grow: 1; overflow: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; background: #ffffff">
<span style="align-self: center; font-size: 12px; font-weight: 500; border: 1.5px solid #221f20; border-radius: 999px; padding: 2px 12px">azi</span>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="6">
<div style="align-self: {{m.side}}; max-width: 66%; display: flex; flex-direction: column; gap: 4px; align-items: {{m.side}}">
<sc-if value="{{m.isFile}}" hint-placeholder-val="{{ false }}">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border: 2px solid #221f20; border-radius: 20px; background: #ffffff"><span style="width: 42px; height: 42px; border-radius: 12px; border: 2px solid #221f20; background: #dd6937; display: grid; place-items: center; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 11px; box-sizing: border-box">PDF</span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">{{m.text}}</span><span style="font-size: 12px; color: #5f5b5d">1,2 MB · deschide</span></span></a>
</sc-if>
<sc-if value="{{m.isText}}" hint-placeholder-val="{{ true }}">
<div style="padding: 11px 16px; background: {{m.bg}}; border: 2px solid #221f20; border-radius: {{m.radius}}; font-size: 16px; line-height: 1.45">{{m.text}}</div>
</sc-if>
<span style="font-size: 11px; color: #5f5b5d">{{m.time}}</span>
</div>
</sc-for>
<div aria-live="polite" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5f5b5d"><span aria-hidden="true" style="display: flex; gap: 5px; padding: 12px 14px; border: 2px solid #221f20; border-radius: 20px 20px 20px 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #dd6937"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #dd6937"></span><span style="width: 8px; height: 8px; border-radius: 50%; background: #dd6937"></span></span>Ioana scrie…</div>
</div>

<form style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 2px solid #221f20">
<button type="button" aria-label="Atașează un fișier" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 2px solid #221f20; background: #e1b345; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5" aria-hidden="true"><path d="M20 11l-8 8a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg></button>
<label style="flex-grow: 1; display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mesaj către Ioana</span><input type="text" placeholder="scrie-i Ioanei…" style="flex-grow: 1; height: 48px; box-sizing: border-box; padding: 0 18px; border: 2px solid #221f20; border-radius: 999px; font-size: 15px"></label>
<button type="button" aria-label="Trimite" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 2px solid #221f20; background: #dd6937; display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#221f20" stroke-width="2.5" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"/></svg></button>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
const c = (i, col, ink, name, last, time, unread, sel) => ({ i, c: col, ink, name, last, time, unread, hasUnread: !!unread, border: sel ? '#221f20' : 'transparent', bg: sel ? '#fbe6dc' : '#ffffff' });
const m = (mine, text, time, file) => ({ text, time, isFile: !!file, isText: !file, side: mine ? 'flex-end' : 'flex-start', bg: mine ? '#dd6937' : '#ffffff', radius: mine ? '20px 20px 6px 20px' : '20px 20px 20px 6px' });
return {
convos: [
c('IR', '#e28ba3', '#221f20', 'Ioana Radu', 'Ne vedem joi la atelier?', '14:02', '2', true),
c('AN', '#79569a', '#ffffff', 'Andrei · mentor', 'Super, ne vedem joi la 16:00!', '13:40', ''),
c('MT', '#e1b345', '#221f20', 'Matei Toma', 'Cine aduce prelungitorul?', 'ieri', '1'),
c('DS', '#abca54', '#221f20', 'Daria Stan', 'Formularul e gata de testat', 'luni', ''),
c('EL', '#77bfb2', '#221f20', 'Elena · [Liceul 2]', 'Mersi pentru șablon!', '7 oct', '')
],
msgs: [
m(false, 'Am terminat a doua variantă de afiș. Ți-o trimit acum.', '13:52'),
m(false, 'afis-campanie-v2.pdf', '13:52', true),
m(true, 'Arată foarte bine! Aș mări puțin titlul.', '13:55'),
m(true, 'O mut la „în revizuire”, ca s-o vadă și Matei.', '13:56'),
m(false, 'Perfect. Am pus și sursele în resurse, în folderul campaniei.', '14:02'),
m(false, 'Ne vedem joi la atelier?', '14:02')
]
};
}
}
</script>
</body>
</html>
